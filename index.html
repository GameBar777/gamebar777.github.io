<meta property="og:type" content="website"><meta property="og:title" content="GameBar｜ゆっくり遊べるゲームの小さな店"><meta property="og:description" content="ブラウザで無料・登録不要で遊べる、落ち着いたゲームを置いている小さな店。GameBar Studio が営んでいます。"><meta property="og:url" content="https://gamebar777.github.io/"><meta property="og:image" content="https://gamebar777.github.io/img/og.png"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f6eedd"><link rel="icon" href="/img/icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&family=Zen+Maru+Gothic:wght@400;700&display=swap"><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><header class="top"><h1 class="logo">GameBar<small>ゲームバー　ゆっくり遊べるゲームの店</small></h1><svg class="glass" viewBox="0 0 64 80" aria-hidden="true" fill="none" stroke="#3b2a1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9 C22 7 42 8 55 10 L35 39 L34 63"/><path d="M9 9 L30 38 L31 63"/><path d="M20 70 C26 66 40 66 46 70 C38 72 28 72 20 70z"/><path d="M16 17 C28 19 38 18 48 17" stroke="#b5452f"/><circle cx="48" cy="6" r="4" stroke="#b5452f"/><path d="M50 3 L58 -3"/></svg></header>
<p class="intro">いらっしゃいませ。ここは、ブラウザでそのまま遊べるゲームを置いている小さな店です。お代は要りません、登録も要りません。棚はまだスカスカですが、少しずつ増やしていきます。</p>
<div class="board"><h2>今日のおすすめ</h2><p id="today">…</p></div>
<h2 class="sec">お品書き</h2><div class="list" id="list"></div>
<h2 class="sec">店の日誌</h2><ul class="journal" id="journal"></ul>
<script type="module">
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const [g,j]=await Promise.all(['/games.json','/journal.json'].map(u=>fetch(u).then(r=>r.json())));
const p=g.filter(x=>x.pick);const t=p[new Date().getDate()%p.length];
document.getElementById('today').innerHTML=`<a href="${e(t.url)}">${e(t.title)}</a> ― ${e(t.master)}`;
document.getElementById('list').innerHTML=g.map(x=>`<article class="item"><div class="row"><img src="${e(x.thumb)}" alt="${e(x.title)}のタイトル画面" width="92" height="115" loading="lazy"><div><div class="genre">${e(x.genre)}</div><h3>${e(x.title)}</h3><p class="sub">${e(x.subtitle)}</p>${x.time?`<p class="sub">${e(x.time)}</p>`:''}</div></div><p class="desc">${e(x.desc)}</p><p class="master">${e(x.master)}</p>${x.note?`<div class="note">${e(x.note)}</div>`:''}<a class="go" href="${e(x.url)}">遊んでみる</a></article>`).join('')+`<article class="item empty"><p>この棚、まだ空いてます。<br>次のゲームを仕込み中。</p></article>`;
document.getElementById('journal').innerHTML=j.slice().reverse().map(x=>`<li><time datetime="${e(x.date)}">${e(x.date.replaceAll('-','.'))}</time>${e(x.text)}</li>`).join('');
</script>
