<meta name="theme-color" content="#140d09"><link rel="icon" href="/img/icon.png"><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><header><h1 class="sign">GameBar</h1><p class="tag">今夜は、どの一杯（ゲーム）にしますか。<br>無料・登録不要・ブラウザでそのまま。</p></header>
<main class="menu"><h2>MENU</h2><div class="grid" id="list"></div></main>
<section class="text"><p>GameBarは、ゆっくり遊べるゲームを集めた小さなバーです。カウンターに座って、気になる一杯を選ぶように、気分に合うゲームを選んでください。</p></section>
<script type="module">
const g=await (await fetch('/games.json')).json();const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('list').innerHTML=g.map(x=>`<a class="card" href="${e(x.url)}" rel="noopener"><img src="${e(x.thumb)}" alt="${e(x.title)}の画面" width="96" height="120" loading="lazy"><div><div class="genre">${e(x.genre)}</div><h3>${e(x.title)}</h3><p class="sub">${e(x.subtitle)}</p><p>${e(x.desc)}</p>${x.time?`<p class="sub">${e(x.time)}</p>`:''}<div class="tags">${x.tags.map(t=>`<span>${e(t)}</span>`).join('')}</div>${x.note?`<div class="note">${e(x.note)}</div>`:''}<span class="btn">遊ぶ ▸</span></div></a>`).join('')+`<div class="card soon"><div><h3>Coming soon</h3><p class="sub">次の一杯を仕込み中です。</p></div></div>`;
</script>
